# Branch `solution` only. On `main` this same file asserts the OPPOSITE - that
# the task stubs are still empty - so do not merge this workflow either way.
# Here it checks that the answer key still answers.
name: reference solution

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: byte-compile every lab file
        run: python -m compileall -q lab

      - name: data files parse, and case ids are unique
        run: |
          python - <<'PY'
          import json, sys

          cases = json.load(open("lab/task1_cases.json"))
          ids = [c["id"] for c in cases]
          assert len(ids) == 16, f"expected 16 task 1 cases, found {len(ids)}"
          assert len(set(ids)) == len(ids), "duplicate case id in task1_cases.json"

          with open("lab/task2_inputs.jsonl", encoding="utf-8") as fh:
              rows = [json.loads(line) for line in fh if line.strip()]
          assert rows, "task2_inputs.jsonl is empty"
          gids = [r["id"] for r in rows]
          assert len(set(gids)) == len(gids), "duplicate case id in task2_inputs.jsonl"

          json.load(open("lab/schema.json"))
          print(f"ok: {len(ids)} task 1 cases, {len(rows)} task 2 inputs")
          PY

      - name: both checkers pass and nothing is confidently wrong
        working-directory: lab
        run: |
          python3 check_task1.py
          out=$(python3 check_task2.py)
          echo "$out"
          echo "$out" | grep -qE "CONFIDENTLY WRONG +0 " || {
            echo "the reference solution produced a confidently-wrong answer"
            exit 1
          }

      - name: the facts it does produce are the gold facts
        working-directory: lab
        run: |
          python3 - <<'PY'
          import json
          from task2_grounding import ground

          rows = [json.loads(l) for l in open("task2_inputs.jsonl", encoding="utf-8") if l.strip()]
          expected_abstentions = {"g08", "g10"}
          answered = abstained = 0
          for row in rows:
              facts = ground(row["text"])
              if facts is None:
                  abstained += 1
                  if row["gold_facts"] is not None:
                      assert row["id"] in expected_abstentions, f"{row['id']} started abstaining"
                  continue
              answered += 1
              assert facts == row["gold_facts"], (
                  f"{row['id']}: grounded {facts}, gold {row['gold_facts']} - "
                  "a right fare from a wrong fact is the one thing this lab is about"
              )
          print(f"ok: {answered} answered with gold-identical facts, {abstained} abstained")
          PY
